<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Result</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Result Portal">
    <meta property="og:title" content="Check Your Result">
    <meta property="og:description" content="Enter your roll number to view your result.">
    <meta property="og:url" content="{{ request.url_root }}">
    <meta property="og:image" content="{{ url_for('static', filename='img/og-image.png', _external=True) }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- Favicon: brand mark -->
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <meta name="theme-color" content="#0a7a3e">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="site-header">
        <a class="wordmark" href="/" aria-label="Result Portal home">
            <img src="{{ url_for('static', filename='img/favicon-32.png') }}" alt="" width="24" height="24">
            <span>Result Portal</span>
        </a>
        <a class="admin-link" href="/login">Admin login <span aria-hidden="true">&rarr;</span></a>
    </header>

    <main class="stage">

        <section class="intro">
            <p class="eyebrow">01 &mdash; Student results</p>
            <h1>Check your<br>result.</h1>
            <p class="lede">Enter your roll number to view your result.</p>
        </section>

        <section class="finder" aria-labelledby="finder-title">
            <!-- Brand mark sits behind the form bars -->
            <div class="mark" aria-hidden="true">
                <img src="{{ url_for('static', filename='img/brand-mark.png') }}" alt="">
            </div>

            <h2 id="finder-title" class="visually-hidden">Search by roll number</h2>

            {% if error %}
            <div class="error" role="alert">{{ error }}</div>
            {% endif %}

            <form id="resultForm" action="/result" method="GET" novalidate>
                <div class="bar bar--roll">
                    <label for="roll">Roll No</label>
                    <input type="text" id="roll" name="roll" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                        autofocus placeholder="Enter roll number" required>
                </div>

                <div class="bar bar--search">
                    <button type="submit" id="submitBtn">
                        <span class="btn-label">Search result</span>
                        <span class="btn-arrow" aria-hidden="true">&rarr;</span>
                    </button>
                </div>

                <p class="hint" id="hint" role="status" aria-live="polite"></p>
            </form>
        </section>

    </main>

    <footer class="site-footer">
        <span>Result Portal</span>
        <span id="year"></span>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
